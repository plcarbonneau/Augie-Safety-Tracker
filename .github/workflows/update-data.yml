name: Daily Campus Safety Log Update

on:
  schedule:
    # Runs at 06:00 UTC (1:00 AM Central) every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Scrape & Update Incident Logs
        run: npx tsx scripts/updateData.ts

      - name: Build Application
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/archivedData.json src/data/fallbackData.ts public/archivedData.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily safety log update" && git push)
